name: Release SF6 Tracker

on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $match = [regex]::Match((Get-Content -Raw web/state.js), "APP_VERSION = '(v[^']+)'")
            $tag = $match.Groups[1].Value
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw 'Invalid release version' }
          git rev-parse --verify "$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x86'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install verified release dependencies
        run: python -m pip install -r requirements-dev.txt -c packaging/constraints-release.txt
      - name: Checkout immutable release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}
      - name: Offline regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/frontend_reliability.test.js tests/i18n.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and audit executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m PyInstaller packaging/sf6tracker.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/verify_build.py "dist/SF6-Tracker-$env:RELEASE_TAG.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/SF6-Tracker-${{ steps.version.outputs.tag }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: dist
      - name: Publish verified tag and executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" "dist/SF6-Tracker-$RELEASE_TAG.exe" --verify-tag --latest --title "SF6 Tracker $RELEASE_TAG" --notes-from-tag
